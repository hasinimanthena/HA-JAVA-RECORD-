P("Synchronized Ticket Booking",r`class TicketOffice { private int seats = 3; synchronized void book(String customer) { if (seats > 0) { System.out.println(customer + " booked a seat"); seats--; } else System.out.println(customer + ": no seats available"); } } public class BookingDemo { public static void main(String[] args) throws InterruptedException { TicketOffice office = new TicketOffice(); Thread[] customers = new Thread[5]; for (int i = 0; i < customers.length; i++) { final String name = "Customer " + (i + 1); customers[i] = new Thread(() -> office.book(name)); customers[i].start(); } for (Thread customer : customers) customer.join(); } }`,`Three customers book seats; the remaining customers see no seats available`),

function week(k){

 app.innerHTML=h;
}
function formatJava(code) {
 const lines = [];
 let line = "", indent = 0, parens = 0, quote = "", escaped = false;
 const flush = () => {
  const value = line.trim();
  if (value) lines.push("  ".repeat(indent) + value);
  line = "";
 };
 for (let i = 0; i < code.length; i++) {
  const ch = code[i];
  if (quote) {
   line += ch;
   if (escaped) escaped = false;
   else if (ch === "\\") escaped = true;
   else if (ch === quote) quote = "";
   continue;
  }
  if (ch === "\"" || ch === "'") { quote = ch; line += ch; continue; }
  if (ch === "(") parens++;
  else if (ch === ")") parens = Math.max(0, parens - 1);
  if (ch === "{") { line = line.trimEnd() + " {"; flush(); indent++; continue; }
  if (ch === "}") {
   flush();
   indent = Math.max(0, indent - 1);
   line = "}";
   let j = i + 1;
   while (j < code.length && /\s/.test(code[j])) j++;
   if (/^(catch|finally|else)\b/.test(code.slice(j))) { line += " "; i = j - 1; }
   else if (code[j] === ";") { line += ";"; i = j; flush(); }
   else if (code[j] === ")" || code[j] === ",") { line += code[j]; i = j; }
   else flush();
   continue;
  }
  if (ch === ";" && parens === 0) { line = line.trimEnd() + ";"; flush(); continue; }
  if (/\s/.test(ch)) { if (line && !line.endsWith(" ")) line += " "; continue; }
  line += ch;
 }
 flush();
 return lines.join("\n");
}
function prog(k,n){
 const w=W[k],p=w&&w.progs&&w.progs[n-1];if(!p)return home();
 let h=`<p class="crumb"><a href="#/">Home</a> / <a href="#/w/${k}">Week ${k}</a> / Program ${n}</p><h1>Program ${num(n)}</h1><p><b>Aim:</b> ${p.t}</p>`;
 h+=p.c?`<div class="lbl">SOURCE CODE</div><pre>${esc(Number(k) >= 10 ? formatJava(p.c) : p.c)}</pre><div class="lbl">OUTPUT</div><pre class="out">${esc(p.o)}</pre>`:`<p class="pend">Code and output for this program will be added soon.</p>`;
 h+=`<div class="nav">${n>1?`<a href="#/w/${k}/${n-1}">← Previous</a>`:`<span></span>`}${n<w.progs.length?`<a href="#/w/${k}/${+n+1}">Next →</a>`:`<a href="#/w/${k}">All programs</a>`}</div>`;
 app.innerHTML=h;
}
